name: Update Weather Data

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-weather:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download weather data
        run: |

          curl -L \
          "https://api.open-meteo.com/v1/forecast?latitude=25.2138&longitude=75.8648&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m&hourly=visibility,uv_index,precipitation_probability&timezone=auto" \
          -o openmeteo.json

      - name: Convert to Arduino JSON
        run: |

          python3 <<'PY'

          import json
          from datetime import datetime, timezone

          with open("openmeteo.json", "r") as f:
              data = json.load(f)

          current = data["current"]
          hourly = data["hourly"]

          code = current["weather_code"]

          if code == 0:
              condition = "Clear"

          elif code in [1, 2]:
              condition = "Cloudy"

          elif code == 3:
              condition = "Overcast"

          elif code in [45, 48]:
              condition = "Fog"

          elif 51 <= code <= 55:
              condition = "Drizzle"

          elif 61 <= code <= 65:
              condition = "Rain"

          elif 71 <= code <= 77:
              condition = "Snow"

          elif 80 <= code <= 82:
              condition = "Showers"

          elif code >= 95:
              condition = "Storm"

          else:
              condition = "Unknown"


          directions = [
              "N",
              "NE",
              "E",
              "SE",
              "S",
              "SW",
              "W",
              "NW"
          ]

          degree = current["wind_direction_10m"]

          direction = directions[
              round(degree / 45) % 8
          ]


          result = {

              "temperature":
                  current["temperature_2m"],

              "feels_like":
                  current["apparent_temperature"],

              "humidity":
                  current["relative_humidity_2m"],

              "wind":
                  current["wind_speed_10m"],

              "wind_direction":
                  direction,

              "pressure":
                  current["surface_pressure"],

              "rain":
                  hourly["precipitation_probability"][0],

              "precipitation":
                  current["precipitation"],

              "visibility":
                  hourly["visibility"][0],

              "uv":
                  hourly["uv_index"][0],

              "condition":
                  condition,

              "weather_code":
                  code,

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat()

          }


          with open("weather.json", "w") as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          PY

      - name: Commit updated weather
        run: |

          git config user.name "Weather Bot"

          git config user.email "actions@github.com"

          git add weather.json

          git diff --cached --quiet || \
          git commit -m "Update weather data"

          git push
